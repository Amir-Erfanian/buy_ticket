{% extends "base.html" %}

{% block title %}
Select Seats
{% endblock %}

{% block content %}

<h2>{{ showtime.movie.name }}</h2>

<h5>{{ showtime.cinema.name }}</h5>

<p>{{ showtime.start_time }}</p>

<hr>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-primary">
        Book Selected Seats
    </button>

</form>

{% endblock %}
